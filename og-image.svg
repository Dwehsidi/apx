<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="g1" cx="82%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#c8161c" stop-opacity=".7"/>
      <stop offset="55%" stop-color="#8f0f14" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#06070a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="12%" cy="88%" r="40%">
      <stop offset="0%" stop-color="#e01f26" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#06070a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#06070a"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- Subtle horizontal rule top & bottom -->
  <rect x="0" y="0" width="1200" height="1" fill="rgba(255,255,255,.06)"/>
  <rect x="0" y="629" width="1200" height="1" fill="rgba(255,255,255,.06)"/>

  <!-- Left red bar accent -->
  <rect x="0" y="0" width="5" height="630" fill="#e01f26"/>

  <!-- Tag label top -->
  <rect x="80" y="82" width="44" height="1" fill="rgba(255,255,255,.25)"/>
  <text x="134" y="87" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,.45)" letter-spacing="3.5">E-GOVERNMENT · CYBERSECURITY · AI · ICT INFRASTRUCTURE</text>

  <!-- APX — large display -->
  <text x="76" y="270" font-family="Georgia,'Times New Roman',serif" font-size="168" font-weight="700" fill="#ffffff" letter-spacing="-5">APX</text>

  <!-- Global — italic -->
  <text x="82" y="370" font-family="Georgia,'Times New Roman',serif" font-size="80" font-style="italic" fill="rgba(255,255,255,.88)" letter-spacing="-1">Digital Infrastructure.</text>

  <!-- Red separator line -->
  <rect x="80" y="400" width="90" height="3" rx="1.5" fill="#e01f26"/>

  <!-- Description -->
  <text x="80" y="456" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="rgba(255,255,255,.52)">Engineered for government and enterprise.</text>
  <text x="80" y="484" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="rgba(255,255,255,.52)">African Scale.</text>

  <!-- Domain -->
  <text x="80" y="578" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="rgba(255,255,255,.28)" letter-spacing="2.5">APX-GLOBAL.NET</text>

  <!-- Right — geometric network decoration -->
  <!-- Outer hexagon -->
  <polygon points="960,95 1085,167 1085,313 960,385 835,313 835,167"
    fill="none" stroke="rgba(224,31,38,.22)" stroke-width="1.5"/>
  <!-- Inner hexagon -->
  <polygon points="960,143 1045,191 1045,289 960,337 875,289 875,191"
    fill="none" stroke="rgba(224,31,38,.12)" stroke-width="1"/>
  <!-- Center node -->
  <circle cx="960" cy="240" r="9" fill="#e01f26" opacity=".85"/>
  <circle cx="960" cy="240" r="20" fill="none" stroke="#e01f26" stroke-opacity=".25" stroke-width="1"/>
  <circle cx="960" cy="240" r="36" fill="none" stroke="#e01f26" stroke-opacity=".1" stroke-width="1"/>
  <!-- Spoke lines to hexagon vertices -->
  <line x1="960" y1="240" x2="960" y2="95"   stroke="rgba(224,31,38,.18)" stroke-width="1"/>
  <line x1="960" y1="240" x2="1085" y2="167" stroke="rgba(224,31,38,.18)" stroke-width="1"/>
  <line x1="960" y1="240" x2="1085" y2="313" stroke="rgba(224,31,38,.18)" stroke-width="1"/>
  <line x1="960" y1="240" x2="960" y2="385"  stroke="rgba(224,31,38,.18)" stroke-width="1"/>
  <line x1="960" y1="240" x2="835" y2="313"  stroke="rgba(224,31,38,.18)" stroke-width="1"/>
  <line x1="960" y1="240" x2="835" y2="167"  stroke="rgba(224,31,38,.18)" stroke-width="1"/>
  <!-- Vertex dots -->
  <circle cx="960"  cy="95"  r="5" fill="rgba(255,255,255,.7)"/>
  <circle cx="1085" cy="167" r="5" fill="rgba(255,255,255,.7)"/>
  <circle cx="1085" cy="313" r="4" fill="rgba(255,255,255,.5)"/>
  <circle cx="960"  cy="385" r="4" fill="rgba(255,255,255,.5)"/>
  <circle cx="835"  cy="313" r="4" fill="rgba(255,255,255,.5)"/>
  <circle cx="835"  cy="167" r="5" fill="rgba(255,255,255,.7)"/>
  <!-- Secondary nodes scattered -->
  <circle cx="960"  cy="143" r="3" fill="rgba(255,255,255,.4)"/>
  <circle cx="1045" cy="191" r="3" fill="rgba(255,255,255,.4)"/>
  <circle cx="1045" cy="289" r="3" fill="rgba(255,255,255,.4)"/>
  <circle cx="875"  cy="191" r="3" fill="rgba(255,255,255,.4)"/>
  <circle cx="875"  cy="289" r="3" fill="rgba(255,255,255,.4)"/>
  <circle cx="960"  cy="337" r="3" fill="rgba(255,255,255,.4)"/>
  <!-- Cross-connect lines between inner nodes -->
  <line x1="960" y1="143" x2="1045" y2="191" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <line x1="1045" y1="191" x2="1045" y2="289" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <line x1="875" y1="191" x2="875" y2="289"   stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <line x1="875" y1="191" x2="960" y2="143"   stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <!-- Extra floating dots for depth -->
  <circle cx="1130" cy="80"  r="2.5" fill="rgba(255,255,255,.25)"/>
  <circle cx="800"  cy="420" r="2"   fill="rgba(255,255,255,.2)"/>
  <circle cx="1110" cy="400" r="2"   fill="rgba(255,255,255,.2)"/>
  <circle cx="820"  cy="130" r="2"   fill="rgba(255,255,255,.2)"/>
  <circle cx="1140" cy="330" r="2"   fill="rgba(255,255,255,.15)"/>
</svg>
